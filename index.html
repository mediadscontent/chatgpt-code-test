<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f5cfed"><title>Sparkle Salon · Level 1</title>
<style>
:root{--pink:#fa80b7;--deep:#bd559e;--purple:#8864bc;--ink:#563b65}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#f7e8f6;color:var(--ink)}body{display:flex;align-items:center;justify-content:center;padding:5px}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;border:0}#app{width:min(100%,440px);margin:auto}#stage{width:100%;aspect-ratio:9/16;position:relative;overflow:hidden;border-radius:24px;border:4px solid white;background:linear-gradient(140deg,#f8dae9,#d9cdf8);box-shadow:0 8px 25px #a96b9d44;touch-action:none;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;isolation:isolate}#stage:fullscreen{width:100vw;height:100dvh;aspect-ratio:auto;border:0;border-radius:0}#portrait{position:absolute;inset:0;touch-action:none}#portrait .frame{position:absolute;inset:0;background-repeat:no-repeat;background-size:400% 200%;background-image:url('./assets/makeover.webp');background-position:0 0;transition:opacity .16s linear;will-change:opacity}#portrait .frame:nth-child(2){opacity:0}#portrait .wash{position:absolute;inset:0;background:linear-gradient(180deg,#f8d9eeaa,transparent 19%,transparent 76%,#b789a144);pointer-events:none}#hud{position:absolute;left:3%;right:3%;top:2.1%;display:flex;align-items:start;justify-content:space-between;gap:6px;z-index:5}#hud .circle{width:43px;height:43px;border-radius:50%;background:linear-gradient(155deg,#ffb1d7,#ef75ae);box-shadow:0 3px 9px #a262913b;border:2px solid white;color:white;font-size:22px;font-weight:900;flex-shrink:0}#hud .middle{flex:1;max-width:192px;text-align:center;background:#fff8f4e8;box-shadow:0 2px 9px #b675a22c;padding:7px 12px 9px;border:2px solid #f5b3d9;border-radius:17px}#lev{font-size:12px;font-weight:900}#bar{margin-top:5px;height:8px;border-radius:8px;background:#eddfed;overflow:hidden}#barfill{width:0;height:100%;background:linear-gradient(90deg,#fa7aaf,#9c79db);transition:width .2s}#taskInfo{position:absolute;top:13%;left:8%;right:8%;padding:6px 12px;border-radius:16px;background:#fff8f6df;text-align:center;z-index:4;box-shadow:0 4px 12px #d092b837}#taskName{font-size:15px;font-weight:900;color:#9a4d90}#taskHint{font-size:11px;margin-top:3px;color:#75557e}#targets{position:absolute;inset:0;pointer-events:none;z-index:3}#targets .target{position:absolute;transform:translate(-50%,-50%);width:37px;height:37px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:white;text-shadow:0 1px 5px #92516a;background:radial-gradient(circle,#ffc1d38f,#fa79ab65);border:2px dashed #ffed86;opacity:.9;transition:opacity .16s,transform .17s}#targets .target.done{opacity:0;transform:translate(-50%,-50%) scale(.2)}#targets .target.help{box-shadow:0 0 0 6px #fff69066,0 0 16px #ffdd78}#targets .target .ring{position:absolute;inset:-5px;border-radius:50%;border:4px solid #fef6fb4d;pointer-events:none}#taskProgress{position:absolute;bottom:17%;left:22%;right:22%;text-align:center;border-radius:25px;background:#fff9f4e9;font-weight:800;font-size:12px;padding:6px;z-index:4}#tools{position:absolute;left:3%;right:3%;bottom:2%;border:3px solid white;border-radius:21px;padding:8px 7px;background:#fce2f4f2;display:flex;justify-content:space-between;gap:5px;box-shadow:0 5px 12px #a7749447;z-index:6}#tools button{flex:1;min-width:0;border-radius:13px;height:61px;background:#e3d1f0;color:#70537f;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;font-size:25px}#tools button small{font-size:9px;margin-top:2px}#tools button.sel{background:#ffd9e6;outline:3px solid #f7d84e}#ghost{display:none;position:absolute;z-index:7;pointer-events:none;font-size:35px;transform:translate(-50%,-55%) rotate(-24deg);filter:drop-shadow(0 5px 4px #854a7890)}#notice{display:none;position:absolute;bottom:22%;left:13%;right:13%;background:#76577ec9;border:1px solid #ffffff5c;padding:9px;text-align:center;color:white;border-radius:15px;font-size:13px;font-weight:750;z-index:15}#screenOverlay{position:absolute;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(155deg,#f8eaf8f0,#ffe6f1f4);backdrop-filter:blur(5px)}.panel{background:#fff8fff7;border-radius:24px;box-shadow:0 8px 25px #b789ac5a;padding:22px 16px;text-align:center;width:100%;max-width:345px;display:flex;align-items:center;flex-direction:column;gap:11px}.panel h2{color:#9d4fba;margin:0;font-size:26px}.panel p{font-size:12px;margin:2px 0 5px;max-width:290px}.big{width:90%;padding:12px 15px;border-radius:18px;color:white;background:linear-gradient(135deg,#f17eac,#b979d1);font-weight:850;font-size:15px;box-shadow:0 4px 9px #be86a65e}.big.alt{background:linear-gradient(135deg,#aa8ada,#8164ba)}.small{font-size:11px;color:#7b6790}#albumGrid{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}#albumGrid button{padding:8px 0;border-radius:11px;background:#ffd3e4;color:#684873;font-weight:bold}#albumGrid button:disabled{background:#eee7f0;color:#af9fb6}.compare{display:flex;width:100%;gap:8px}.comparison{width:50%;position:relative;aspect-ratio:9/16;border-radius:14px;overflow:hidden;border:2px solid white;box-shadow:0 2px 9px #b4859b42}.comparison .frame{position:absolute;inset:0;background-image:url('./assets/makeover.webp');background-size:400% 200%;background-repeat:no-repeat}.comparison span{position:absolute;left:0;right:0;bottom:0;background:#fff9;color:#845579;font-size:11px;font-weight:900;padding:5px}.spark{position:absolute;pointer-events:none;z-index:9;width:7px;height:7px;border-radius:50%;background:#fff6ac;box-shadow:0 0 7px white;animation:sparkMove 600ms ease-out forwards}@keyframes sparkMove{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.6)}}#footer{font-size:11px;text-align:center;margin:7px 0;color:#876b94}body.holdPage{overflow:hidden;touch-action:none}
</style></head><body><div id="app"><div id="stage">
<div id="portrait"><div class="frame" id="frameA"></div><div class="frame" id="frameB"></div><div class="wash"></div></div>
<div id="hud"><button class="circle" data-cmd="home" title="Trang chủ">⌂</button><div class="middle"><div id="lev">MÀN 1 · 1/7</div><div id="bar"><div id="barfill"></div></div></div><button class="circle" data-cmd="full" title="Toàn màn hình">⛶</button><button class="circle" data-cmd="settings" title="Cài đặt">⚙</button></div>
<div id="taskInfo"><div id="taskName">🎀 Trang điểm</div><div id="taskHint">Kéo dụng cụ lên vùng được đánh dấu</div></div><div id="targets"></div><div id="taskProgress">Tiến độ 0%</div><div id="tools"></div><div id="ghost"></div><div id="notice"></div><div id="screenOverlay"></div>
</div><div id="footer">Vùng chơi đã khóa vuốt cuộn chat · Ảnh nhân vật thay đổi theo tiến độ</div></div>
<script>
(()=>{
'use strict';const root=document.getElementById('app');if(root.dataset.active)return;root.dataset.active='true';
const by=id=>document.getElementById(id),stage=by('stage'),portrait=by('portrait'),screen=by('screenOverlay'),marks=by('targets'),tools=by('tools'),ghost=by('ghost'),frameA=by('frameA'),frameB=by('frameB');
const ico=['🪮','🧽','🧴','✂️','🧊','💇','🖌️'],names=['Lược','Bông','Kem','Nhíp','Mắt','Tóc','Cọ'];
const tasks=[
 {title:'Gỡ tóc rối',hint:'Chải phần tóc rối lộ ra ngoài khăn theo hướng từ trên xuống',mode:'down',spots:[[49,10],[30,13],[72,13],[10,39],[90,38]],required:58},
 {title:'Làm sạch khuôn mặt',hint:'Chà bông trên các vết bẩn',mode:'rub',spots:[[28,52],[58,57],[70,54]],required:80},
 {title:'Chăm sóc mụn',hint:'Chạm và giữ kem tại mỗi nốt mụn',mode:'hold',spots:[[58,38],[70,55],[42,65]],required:620},
 {title:'Chỉnh lông mày',hint:'Vuốt nhíp từ dưới lên để loại bỏ sợi mọc lệch',mode:'up',spots:[[33,43],[42,44],[57,43],[66,44]],required:62},
 {title:'Chăm sóc mắt',hint:'Chà nhẹ ở vùng dưới hai mắt',mode:'rub',spots:[[33,51],[66,51]],required:92},
 {title:'Tạo kiểu tóc',hint:'Chải tóc lộ ra ngoài khăn, không chải lên khăn',mode:'down',spots:[[46,11],[26,15],[74,16],[10,40],[90,40]],required:68},
 {title:'Hoàn thiện diện mạo',hint:'Chà cọ nhẹ trên hai má và môi',mode:'rub',spots:[[30,56],[70,56],[50,61]],required:90}
];
const KEY='sparkle_makeover_progress_1';let save={level:1,unlocked:1,done:{}};try{save=Object.assign(save,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){};const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};
let scene='menu',level=save.level||1,step=0,targets=[],tool=0,dragging=false,ptrId=null,prev=null,holdId=null,changing=false,page=0,help=false,clock=0,noticeTimer=null,previewVersion=0,visualBase=0;
const pos=i=>`${(i%4)/3*100}% ${Math.floor(i/4)*100}%`;
function setFrame(el,i){el.style.backgroundPosition=pos(Math.max(0,Math.min(7,i)))}
function setStageVisual(i,progress){if(visualBase!==i){setFrame(frameA,i);setFrame(frameB,Math.min(7,i+1));visualBase=i}frameB.style.opacity=String(Math.min(1,Math.max(0,progress)))}
function notice(s){by('notice').textContent=s;by('notice').style.display='block';clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>{by('notice').style.display='none'},900)}
function show(s){screen.style.display='flex';screen.innerHTML=`<div class="panel">${s}</div>`}
function hide(){screen.style.display='none'}
function stop(){dragging=false;ptrId=null;prev=null;clearInterval(holdId);holdId=null;ghost.style.display='none'}
function menu(){stop();scene='menu';setStageVisual(0,0);show(`<div style="font-size:40px">🎀✨</div><h2>SPARKLE SALON</h2><p>Cô gái băng đô thỏ đang cần bạn giúp makeover! Mỗi nhiệm vụ hoàn thành, ngoại hình sẽ đẹp thêm một bước.</p><button class="big" data-action="play">▶ CHƠI NGAY</button><button class="big alt" data-action="album">📖 ALBUM LEVEL</button><div class="small">Đã mở khóa ${save.unlocked}/30 màn</div>`)}
function album(){stop();scene='album';let list='';for(let i=page*10+1;i<=page*10+10;i++)list+=`<button data-level="${i}" ${i>save.unlocked?'disabled':''}>${i>save.unlocked?'🔒':i}</button>`;show(`<h2>📖 Album</h2><p>Chọn màn đã mở khóa</p><div id="albumGrid">${list}</div><div class="small">Trang ${page+1}/3</div><div style="display:flex;gap:10px;width:100%"><button class="big alt" data-action="prev">◀</button><button class="big alt" data-action="nextpage">▶</button></div><button class="big" data-action="menu">VỀ MENU</button>`)}
function start(n){stop();scene='game';level=Math.min(30,Math.max(1,n));save.level=level;persist();step=0;hide();prepare()}
function prepare(){const q=tasks[step],diff=level<=2?.8:level%10===0?1.5:level%10===9?1.3:1.07;targets=q.spots.map(([x,y],i)=>({id:i,x,y,v:0,max:Math.round(q.required*diff),done:false}));changing=false;tool=step;help=false;visualBase=-1;setStageVisual(step,0);by('lev').textContent=`MÀN ${level} · ${step+1}/7`;by('barfill').style.width=`${step/7*100}%`;by('taskName').textContent=ico[step]+' '+q.title;by('taskHint').textContent=q.hint;renderTools();renderMarks()}
function renderTools(){tools.innerHTML=ico.map((sym,i)=>`<button data-tool="${i}" class="${i===tool?'sel':''}" aria-label="${names[i]}">${sym}<small>${names[i]}</small></button>`).join('')}
function renderMarks(){marks.innerHTML=targets.map(t=>`<div class="target ${t.done?'done':''} ${help&&!t.done?'help':''}" style="left:${t.x}%;top:${t.y}%;opacity:${t.done?0:Math.max(.28,1-t.v/t.max)}"><div class="ring" style="border-top-color:#ffffff;transform:rotate(${Math.round(t.v/t.max*360)}deg)"></div>${ico[step]}</div>`).join('');const prog=targets.reduce((sum,t)=>sum+t.v/t.max,0)/targets.length;by('taskProgress').textContent='Tiến độ '+Math.round(prog*100)+'%';setStageVisual(step,prog);return prog}
function particles(x,y){const rect=stage.getBoundingClientRect();for(let i=0;i<7;i++){let n=document.createElement('span');n.className='spark';n.style.left=(x-rect.left)+'px';n.style.top=(y-rect.top)+'px';n.style.setProperty('--tx',`${(Math.random()-.5)*75}px`);n.style.setProperty('--ty',`${(Math.random()-.5)*80}px`);stage.appendChild(n);setTimeout(()=>n.remove(),650)}}
function complete(){if(changing)return;changing=true;stop();notice('✨ Hoàn thành!');setStageVisual(step,1);const version=++previewVersion;setTimeout(()=>{if(scene!=='game'||version!==previewVersion)return;if(step===6){save.unlocked=Math.max(save.unlocked,Math.min(30,level+1));save.done[level]=true;save.level=Math.min(30,level+1);persist();scene='result';setStageVisual(7,0);show(`<div style="font-size:35px">🏆✨</div><h2>Đẹp lên rồi!</h2><p>7 bước chăm sóc hoàn thành. So sánh diện mạo trước và sau:</p><div class="compare"><div class="comparison"><div class="frame" style="background-position:${pos(0)}"></div><span>TRƯỚC</span></div><div class="comparison"><div class="frame" style="background-position:${pos(7)}"></div><span>SAU</span></div></div><button class="big" data-action="nextlevel">▶ MÀN TIẾP THEO</button><button class="big alt" data-action="album">📖 ALBUM</button>`)}else{step++;prepare()}},570)}
function process(p,d,deltaTime){if(scene!=='game'||changing||screen.style.display!=='none')return;const q=tasks[step];if(tool!==step){notice('Chọn đúng dụng cụ');return}let r=portrait.getBoundingClientRect(),xx=(p.x-r.left)/r.width*100,yy=(p.y-r.top)/r.height*100,best=null,closest=1e10;for(const t of targets){if(t.done)continue;let dist=Math.hypot((t.x-xx)*r.width/100,(t.y-yy)*r.height/100);if(dist<closest){closest=dist;best=t}}if(!best||closest>Math.max(24,r.width*.095))return;let inc=0,len=Math.hypot(d.x,d.y);if(q.mode==='rub'&&len>1.5&&len<95)inc=Math.min(19,len*1.23);if(q.mode==='down'&&d.y>2&&Math.abs(d.y)>.65*Math.abs(d.x))inc=Math.min(24,d.y*1.45);if(q.mode==='up'&&d.y< -2&&-d.y>.65*Math.abs(d.x))inc=Math.min(24,-d.y*1.45);if(q.mode==='hold')inc=deltaTime;if(inc<=0)return;best.v=Math.min(best.max,best.v+inc);if(best.v===best.max&&!best.done){best.done=true;particles(p.x,p.y)}const pct=renderMarks();if(pct>=.999)complete()}
function moveGhost(p){const r=stage.getBoundingClientRect();ghost.style.left=p.x-r.left+'px';ghost.style.top=p.y-r.top+'px'}
function down(e){if(scene!=='game'||changing||screen.style.display!=='none')return;e.preventDefault();dragging=true;ptrId=e.pointerId;prev={x:e.clientX,y:e.clientY};try{portrait.setPointerCapture(e.pointerId)}catch(err){}ghost.textContent=ico[tool];ghost.style.display='block';moveGhost(prev);if(tasks[step].mode==='hold'){clearInterval(holdId);holdId=setInterval(()=>{if(dragging&&prev)process(prev,{x:0,y:0},45)},45)}}
portrait.addEventListener('pointerdown',down);portrait.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==ptrId)return;e.preventDefault();const p={x:e.clientX,y:e.clientY};process(p,{x:p.x-prev.x,y:p.y-prev.y},0);prev=p;moveGhost(p)});portrait.addEventListener('pointerup',stop);portrait.addEventListener('pointercancel',stop);
stage.addEventListener('touchmove',e=>{e.preventDefault();e.stopPropagation()},{passive:false});stage.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
async function fullscreen(){if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){}return}let f=stage.requestFullscreen||stage.webkitRequestFullscreen;if(f){try{await f.call(stage);return}catch(e){}}notice('ChatGPT có thể không hỗ trợ toàn màn hình')}
root.addEventListener('click',e=>{let btn=e.target.closest('button');if(!btn)return;if(btn.dataset.tool!==undefined){tool=+btn.dataset.tool;renderTools();return}if(btn.dataset.level!==undefined&&!btn.disabled){start(+btn.dataset.level);return}let k=btn.dataset.action||btn.dataset.cmd;if(k==='full'){fullscreen();return}if(k==='home'){menu();return}if(k==='settings'){if(scene!=='game')return;stop();show(`<h2>⚙ Tạm dừng</h2><button class="big" data-action="resume">▶ TIẾP TỤC</button><button class="big alt" data-action="retry">↻ CHƠI LẠI</button><button class="big" data-action="menu">VỀ MENU</button>`);return}if(k==='play')start(Math.min(level,save.unlocked));if(k==='menu')menu();if(k==='album')album();if(k==='prev'){page=Math.max(0,page-1);album()}if(k==='nextpage'){page=Math.min(2,page+1);album()}if(k==='resume')hide();if(k==='retry')start(level);if(k==='nextlevel')start(Math.min(30,level+1))});
// Load just one compressed atlas, then run all seven changes in memory.
window.__sparkleQA=()=>({scene,step,level,targets:targets.map(t=>({x:t.x,y:t.y,v:t.v,max:t.max,done:t.done})),tool,changing});
const preload=new Image();preload.onload=()=>menu();preload.onerror=()=>menu();preload.src='./assets/makeover.webp';if(preload.complete)menu();
})();
</script></body></html>
