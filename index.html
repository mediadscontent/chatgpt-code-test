<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Test · Chạm Sao</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(145deg,#111827,#312e81);color:#fff;font-family:system-ui,sans-serif}
main{text-align:center;padding:24px;width:min(94vw,420px)}h1{font-size:2rem}#star{font-size:92px;background:none;border:0;cursor:pointer;touch-action:manipulation;transition:transform .1s}#star:active{transform:scale(.83)}.score{font-size:1.7rem;font-weight:700}.hint{opacity:.7}
</style></head>
<body><main><h1>⭐ Chạm Sao</h1><p class="hint">Game thử nghiệm push từ ChatGPT lên GitHub</p><button id="star" aria-label="Chạm sao">⭐</button><p class="score">Điểm: <span id="score">0</span></p><button onclick="document.getElementById('score').textContent='0'">Chơi lại</button></main>
<script>let points=0;document.getElementById('star').addEventListener('click',()=>{document.getElementById('score').textContent=++points});</script>
</body></html>
